<style>

:root[data-theme=dark]{--bg:#18191a;--card:#242526;--tx:#e4e6eb;--mu:#b0b3b8;--bd:#3e4042;--ac:#2d88ff;--ac2:#ffa24d;--ex:#38c880;--go:#6ea6ff;--av:#f2b53a;--po:#ff6f62;--sh:none;--on:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
header{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b4fc2 0%,#1877f2 55%,#3b8cff 100%);color:#fff;padding:24px 16px 28px}
header:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.2),transparent 40%),radial-gradient(circle at 8% 115%,rgba(255,138,31,.4),transparent 45%);pointer-events:none}header .w{position:relative}
.eb{display:block;font-size:1.05rem;letter-spacing:.02em;font-weight:700;opacity:.95;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}.brand .lg{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.pills span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:600}
.w{max-width:960px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:clamp(1.6rem,5vw,2.4rem);margin:0 0 6px;line-height:1.15}header p{margin:0;opacity:.92;max-width:560px}
#th{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:8px 14px;cursor:pointer;font-size:.9rem;white-space:nowrap}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);box-shadow:var(--sh)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px;max-width:960px;margin:0 auto}
.tabs button{border:0;border-bottom:3px solid transparent;background:none;color:var(--mu);padding:14px 16px 11px;font-size:.95rem;font-weight:600;cursor:pointer;white-space:nowrap;border-radius:8px 8px 0 0}.tabs button:hover{background:var(--bg)}.tabs button span{margin-right:6px}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
main{max-width:960px;margin:0 auto;padding:0 16px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin-top:14px;box-shadow:var(--sh)}
h2{font-size:1.3rem;margin:26px 0 2px}h3{font-size:1.02rem;margin:0 0 6px}.sub{color:var(--mu);margin:2px 0 4px}
.badge{display:inline-block;font-size:.72rem;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);vertical-align:middle}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:540px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
.e{color:var(--ex);font-weight:700}.g{color:var(--go);font-weight:700}.a{color:var(--av);font-weight:700}.p{color:var(--po);font-weight:700}
.note{color:var(--mu);font-size:.78rem;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--bg);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:10px 12px}.kpi small{color:var(--mu);display:block;font-size:.74rem}.kpi b{font-size:1.25rem}
.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 22px}.sl label{display:flex;justify-content:space-between;font-size:.88rem}.sl input{width:100%;accent-color:var(--ac)}
select,input[type=number],input[type=text]{padding:9px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
.btn{display:inline-block;background:var(--ac);color:var(--on);text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:700}
ul,ol{margin:6px 0;padding-left:20px}li{margin:5px 0}
.flag{border-left:4px solid var(--po);padding:6px 12px;margin:8px 0;background:var(--bg);border-radius:0 10px 10px 0}.flag.ok{border-color:var(--ex)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.hs{width:250px;flex:none;margin-left:auto}@media(max-width:760px){.hs{display:none}}
.banner{display:flex;align-items:center;gap:14px;margin-top:26px}.banner svg{width:110px;flex:none;background:var(--card);border:1px solid var(--bd);border-radius:14px}.banner h2{margin:0}
.chip{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;color:#fff;font-weight:800;margin-right:8px;vertical-align:middle}
.fun text{font:700 13px system-ui;fill:#fff}
.ff{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.ff label{font-size:.82rem;color:var(--mu);display:block;margin-bottom:3px}.ff input,.ff select{width:100%}
button.btn{border:0;cursor:pointer;font-size:.95rem;padding:10px 16px}.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.paper{background:var(--card);border:1px solid var(--bd);border-radius:12px;border-top:5px solid var(--ac);padding:22px;margin-top:14px}.paper h3{margin:20px 0 6px;font-size:1.05rem;border-bottom:2px solid var(--ac);padding-bottom:4px}.paper p{margin:6px 0}
.rh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.rh small{color:var(--mu);letter-spacing:.08em}.rh h2{margin:4px 0}.vd{font-weight:800;border:2px solid currentColor;border-radius:99px;padding:6px 14px;align-self:flex-start}
@media print{header,nav,footer,.np{display:none!important}:root,:root[data-theme=dark]{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#ccc}main{padding:0;max-width:none}.paper{border:0;border-top:4px solid var(--ac);padding:10px 0 0;margin:0}.paper:not(:last-child){break-after:page}.kpi{break-inside:avoid}}
.pri-High{color:var(--po);font-weight:700}.pri-Medium{color:var(--av);font-weight:700}.pri-Low{color:var(--go);font-weight:700}
.lg{background:#fff;border-radius:12px;padding:8px 14px;display:inline-block;margin-bottom:10px}.lg img{display:block;height:70px;width:auto;max-width:100%}.rh .lg img{height:84px}@media(max-width:560px){.lg img{height:56px}.rh .lg img{height:64px}}
@media print{.lg{padding:0;margin-bottom:6px}}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-top:8px}.ch{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.ch>b{display:block;font-size:.85rem;margin-bottom:4px}.chart{width:100%;height:auto;display:block}
#rf[data-t=wk] .dt,#rf[data-t=dt] .wk{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;cursor:pointer;font-size:.9rem}.chips button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
@media print{.ch{break-inside:avoid}}
.fxs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin-top:10px;align-items:start}
.fx{border:1px solid var(--bd);border-radius:10px;background:var(--bg)}.fx summary{cursor:pointer;list-style:none;padding:10px 12px 10px 34px;position:relative}.fx summary::-webkit-details-marker{display:none}
.fx summary:before{content:"+";position:absolute;left:12px;top:9px;font-weight:700;color:var(--ac);font-size:1.05rem}.fx[open] summary:before{content:"–"}
.fx summary b{display:block;font-size:.93rem}.fx summary small{color:var(--mu);display:block;line-height:1.35;margin-top:2px}.fx[open]{grid-column:1/-1;border-color:var(--ac);background:var(--card)}
.fxb{padding:0 14px 12px 34px}.fxb h4{margin:4px 0 2px;font-size:.88rem;color:var(--ac)}.fxb p{margin:6px 0;line-height:1.55}.tipx{background:var(--bg);border-left:4px solid var(--ex);padding:8px 10px;border-radius:0 8px 8px 0}
.two>*,.split>*,.cols2>*,.charts>*,.fxs>*{min-width:0}.card{min-width:0}
footer{color:var(--mu);font-size:.78rem;margin-top:28px}
/* ===== Layout optimisation: desktop + mobile ===== */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{overflow-x:hidden}
.w,.tabs,main{max-width:1240px}

section{scroll-margin-top:68px}
.two{margin-top:14px;gap:14px}.two>.card{margin-top:0}
.card{transition:box-shadow .15s}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.ck:focus-within{outline:3px solid var(--ac2);outline-offset:2px}
.tabs button{min-height:48px}.chips button{min-height:40px}
input[type=number],input[type=text],select{max-width:100%}
td,th{overflow-wrap:anywhere}
@media(min-width:900px){.tabs{justify-content:center}.tabs button{padding:15px 22px 12px;font-size:1rem}}
@media(min-width:1100px){.hs{width:300px}.banner svg{width:130px}.card{padding:20px 24px}h2{font-size:1.45rem}.sl{gap:16px 32px}}
@media(max-width:760px){main{padding:0 14px 56px}header{padding:20px 14px 22px}.card{padding:14px}.paper{padding:16px}.banner{gap:10px}.banner svg{width:80px}h2{font-size:1.18rem}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.kpi b{font-size:1.1rem}.pills span{font-size:.74rem;padding:3px 10px}.tabs{padding:0 6px}.tabs button{padding:12px 13px 9px;font-size:.88rem}table{font-size:.82rem}th,td{padding:8px 6px}.ff{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}

/* ===== Ads Manager tab ===== */
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;margin-top:14px}.vgrid>.card{margin-top:0}
@media(max-width:860px){.vgrid{grid-template-columns:1fr}}
.ff1{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ff1 label{font-size:.82rem;color:var(--mu);display:block;margin-bottom:3px}.ff1 input,.ff1 select{width:100%}
@media(max-width:480px){.ff1{grid-template-columns:1fr}}
.step{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--bd)}.step span.note{font-size:.84rem}.step strong{font-size:1.1rem;white-space:nowrap}
.step.total{background:var(--bg);border:2px solid var(--ac);border-radius:12px;margin-top:10px;padding:14px}.step.total strong{font-size:1.5rem;color:var(--ac)}
.cks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin-top:8px}.cks.one{grid-template-columns:1fr}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);cursor:pointer}
.ck input{margin-top:3px;width:18px;height:18px;accent-color:var(--ac);flex:none}.ck b{display:block;font-size:.92rem;line-height:1.3}.ck small{color:var(--mu);display:block;line-height:1.35;margin-top:2px}
.ck:has(input:checked){border-color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
.tk:has(input:checked) b{text-decoration:line-through;color:var(--mu)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.gh h3{margin:0}
.btn.sm{padding:6px 12px;font-size:.82rem;min-height:0;width:auto}
.pbar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;background:var(--ex);width:0;transition:width .25s}
.cols{columns:2 260px;column-gap:28px;padding-left:20px}.cols li{break-inside:avoid}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.bar input[type=text]{flex:1;min-width:180px}

['1 · Account setup & access (once per client)',['Verify the business portfolio, Page and ad account access; confirm PHP currency and Philippine time zone.','Add a payment method, spending limit and balance or top-up alerts.','Install the Pixel / TikTok Pixel / Google tag and the server-side API; test every event.','Verify the website domain and set priority conversion events.','Assign roles (least access needed) and turn on two-factor authentication for every admin.','Save column presets and a standard naming format: Goal_Audience_Offer_Date.']],
['2 · Strategy & planning (each client or month)',['Collect the brief: goal, product, price, profit margin, target customer, service area and budget.','Set KPIs: target cost per result, break-even ROAS and monthly result target.','Choose platforms and split the budget (Facebook/Instagram, TikTok, Shopee, Google).','Compute the ad budget with 12% VAT and send the client the total (VAT tool above).','Build a promo calendar: paydays, 9.9 / 10.10 / 11.11 / 12.12, holidays and “ber” months.','Research competitors in the Meta Ad Library and TikTok Creative Center.']],
['3 · Creative & copy',['Write the creative brief: hook (first 3 seconds), offer, proof and call to action.','Prepare 3–5 creatives per ad set (UGC video, demo, static offer, testimonial).','Write primary text, headlines and descriptions (Taglish when it fits the audience).','Check ad policies: no false claims, health or income promises, or misleading before-and-after.','Check safe zones, captions for sound-off viewing and file sizes per placement.','Get written client approval for every creative and offer.']],
['4 · Campaign build & launch',['Build the structure: one goal per campaign, 1–3 ad sets, 3–5 ads each.','Set audiences, exclusions, placements, schedule and budget.','Add UTM parameters, test every link and the Messenger / checkout flow.','Preview all placements and confirm pixel events fire.','Publish and confirm status moves from In review to Active.','Log the launch date, budget and settings in the change log.']],
['5 · Daily management (10–15 minutes)',['Check delivery status, rejected ads and account notifications.','Review spend against budget and cost per result for the last 3 days.','Check frequency, CTR and rankings; pause obvious losers.','Reply to new messages, comments and leads within 5 minutes; flag lead quality.','Never change budgets by more than 20% a day; avoid edits in the learning phase.','Write down every change made and why.']],
['6 · Weekly',['Export data and generate the weekly report (Reports tab).','Launch 1–2 new creatives; refresh ads whose frequency passed 3.','Scale winners about 20% every 2–3 days; pause ads with 2–3× target cost and no results.','Google / Shopee: review the search terms and keyword reports, add negatives and adjust bids.','Review lead and sales quality with the client; update the next-week plan.']],
['7 · Monthly',['Send the month-end report with insights and next-month plan.','Compare results with KPIs and break-even ROAS; calculate real cost per customer.','Reconcile billing: ad spend, 12% VAT, invoices and receipts.','Audit account health: pixel events, policy status, roles and access.','Plan next month’s budget, promos and 4 new creatives.','Archive winning ads and learnings for reuse.']],
['8 · Compliance & client care',['Follow Meta, TikTok, Shopee and Google ad policies.','Handle customer data under the Data Privacy Act (RA 10173).','Keep DTI/SEC and FDA documents ready where the product needs them.','Keep the account funded so campaigns never stop unexpectedly.','Tell the client about every major change, result swing or policy issue.','Back up all creative files and account assets.']]];

const HOWR={
fb:[
['Campaign objectives','In Ads Manager you click Create and choose what you want most: Awareness, Traffic, Engagement, Leads, App promotion or Sales. Meta then optimizes delivery toward people likely to take that action, so the objective decides who sees the ad and how results are counted.','Pick the objective for the result you actually pay for. For inquiries use a Messenger conversion location.'],
['Advantage+ campaign budget','You set one budget at campaign level and Meta moves it between ad sets toward the ones getting the cheapest results each day. You can still set minimum and maximum spend limits on individual ad sets.','Use it with 3 or more ad sets that share one goal; set a minimum spend on any test you want to protect.'],
['Special ad categories','When ads relate to credit, employment, housing or social issues, you declare the category while creating the campaign. Meta then limits targeting options such as age, gender and detailed location to prevent discrimination.','Declare honestly; undeclared ads can be rejected and the account restricted.'],
['A/B tests and experiments','You duplicate a campaign or ad set and change one variable, such as the creative or audience. Meta splits the audience so the groups do not overlap, runs both versions and reports which one wins on your chosen metric.','Change one thing only and run at least 3–7 days so each version collects enough results.'],
['Core audiences','In the ad set you choose location, age, gender, language and optional interests or behaviors. Meta shows the ad only to people who match, and an audience size gauge warns you when the audience is too narrow.','Keep the audience large; very narrow core audiences raise costs and slow delivery.'],
['Custom audiences','You build lists from your own data: website visitors through the Pixel, customer lists, app users, or people who engaged with your Page, Instagram or videos. Meta matches them to accounts so you can retarget or exclude them.','Create 30-day engagers and 14-day website visitors first; they are your warmest pools.'],
['Lookalike audiences','You choose a source audience, such as buyers or people who messaged you, and a country. Meta finds people with similar traits and lets you pick a size from 1% (closest match) to 10% (widest).','Use a source of 100+ real customers; start at 1–3% and widen when volume stalls.'],
['Advantage+ audience','You give Meta optional suggestions such as age and interests. The system treats them as hints and expands beyond them when it expects better results, learning from your creative and conversions.','Works best with strong creative and a working Pixel; compare it once against a manual audience.'],
['Saved audiences & exclusions','You save a targeting setup once and reuse it across ad sets. Exclusions remove groups, such as recent buyers or people who already messaged, so you do not pay to show ads to them again.','Always exclude purchasers from prospecting ads to protect frequency and budget.'],
['Advantage+ / manual placements','With Advantage+ placements Meta spreads the ad across Facebook, Instagram, Messenger and Audience Network wherever it expects the cheapest results. With manual placements you tick the exact feeds, Reels and Stories you allow.','Start automatic; after 3 days check the placement breakdown and switch off placements costing 1.5× more.'],
['Daily or lifetime budget','A daily budget lets Meta spend up to that amount per day, with some days a little higher and others lower so the weekly average matches. A lifetime budget spreads a fixed total across the start and end dates you set.','Use daily budgets for always-on ads and lifetime budgets for promos with an end date.'],
['Ad scheduling','With a lifetime budget you can choose the days and hours when ads may run. Spend is then concentrated when your team can reply and customers are active.','Use it when you only answer messages during working hours.'],
['Bid strategy','Highest volume lets Meta get the most results for the budget. Cost per result goal aims for an average cost you set, Bid cap limits what Meta may bid in each auction, and ROAS goal targets a return on ad spend.','Begin with highest volume; add a cost goal only once you know your normal cost per result.'],
['Conversion location','You decide where the result happens: website, Messenger, Instagram, WhatsApp, phone calls, an app or an instant form. Meta then optimizes for people likely to complete the action in that place.','Match it to how you really sell; use Messenger for inquiry-driven businesses.'],
['Optimization & attribution','The performance goal tells Meta which event to chase, for example conversations started or purchases. The attribution setting defines how many days after a click or view a result is credited to the ad.','Keep attribution the same when comparing periods, or results will not match.'],
['Image, video & carousel ads','You upload one image or video, or several swipeable cards in a carousel, then add primary text, a headline and a call-to-action button. Meta automatically fits the ad to each placement.','Lead with one benefit and the price; use carousels to show several products or steps.'],
['Reels, Stories & Instant Experience','Vertical 9:16 creative fills the whole screen in Reels and Stories. An Instant Experience opens a full-screen mobile page after a tap, mixing video, images and products.','Keep key text out of the top and bottom 15%, where buttons and captions cover it.'],
['Dynamic creative & Advantage+ creative','You upload several images, videos, headlines and descriptions and Meta mixes them, learning which combinations perform best. Advantage+ creative can also apply optional enhancements such as brightness, music or text improvements.','Review the previews and untick enhancements that change your product, price or brand look.'],
['Partnership ads','A creator or partner gives you permission, through a code or Business Portfolio access, so your ad runs from their handle. The ad carries their credibility and can reach people beyond their followers.','Pick creators whose followers match your buyers and agree on usage rights in writing.'],
['Catalog (dynamic product) ads','You connect a product catalog and Meta automatically shows each person products they viewed or are likely to want, using Pixel events, in a template you design.','Keep product titles, prices, stock and images accurate and fresh.'],
['Lead forms & Click-to-Messenger','Instant forms open inside Facebook or Instagram with the person’s contact details prefilled. Click-to-Messenger ads open a chat with a welcome message and quick replies instead of a website.','Reply within 5 minutes; speed matters more than form length.'],
['Ad previews & identity','The preview tool shows how an ad looks in every placement before publishing. Identity is the Facebook Page and Instagram account the ad appears from, which should match your brand.','Always preview on mobile and check cropped text and logos in Reels.'],
['Advantage+ shopping campaigns','This is a largely automated sales campaign. You provide a catalog or creatives and a budget, and Meta combines audiences, placements and creative variations itself to find buyers, with a setting to limit spend on existing customers.','Give it several creatives and a healthy Pixel with purchase events.'],
['Commerce Manager & catalogs','Commerce Manager is where you upload products by hand, by spreadsheet feed or through a partner platform. Products sync to ads and to Facebook and Instagram shops, and diagnostics show errors that block approval.','Check the diagnostics tab weekly for rejected items.'],
['Automated rules','You create IF-THEN rules, for example pause an ad when cost per result is above your limit after a set spend, or raise the budget when results are strong. Meta checks them on a schedule and notifies you or acts.','Start with notification-only rules until you trust the thresholds.'],
['Meta Pixel & Conversions API','The Pixel is code on your website that reports events such as page views and purchases. The Conversions API sends the same events from your server, which survives browser tracking limits and improves matching.','Run both and confirm events are deduplicated in Events Manager.'],
['Events Manager & domain verification','Events Manager shows which events your Pixel and API receive and how well they match. Verifying your domain proves you own it and lets you configure and prioritize web events for ad measurement.','Use Test Events to confirm each key event fires before launching.'],
['Custom columns & presets','In Ads Manager you choose which metrics appear in the table, such as cost per message, CTR and frequency, and save the set as a preset you can reapply to any view.','Save one preset for messages and another for sales.'],
['Breakdowns','You split results by delivery (age, gender, placement, platform, device) or by time (day, week). This shows which segments cost less and which waste budget.','Export age and placement breakdowns monthly to refine targeting.'],
['Scheduled & exported reports','In Ads Reporting you build a report, then schedule it by email or export it as CSV or Excel. You can include breakdowns, filters and custom metrics for clients.','Schedule a weekly report to yourself before the client meeting.'],
['Delivery status & learning phase','Each ad set shows a status such as Active, Learning, Learning limited or Not delivering. While learning, the system is still testing delivery and generally needs around 50 optimization events a week to exit.','Avoid big edits during learning; merge ad sets that stay learning limited.'],
['Ads Reporting & Ad Library','Ads Reporting is the full tool for custom reports. The Ad Library is a public database where you can search any advertiser and see its active ads, which is useful for competitor research.','Search competitors weekly; ads that run for months are likely working.'],
['Business portfolio & roles','A business portfolio holds your Pages, ad accounts and pixels. You add people and partners and give each only the access they need, either full control or task-based access.','Limit admins to two and turn on two-factor authentication.'],
['Payment methods & spending limit','You add cards, e-wallets or other available methods in Billing. An account spending limit caps total spend so a runaway campaign cannot overspend.','Keep a backup payment method so ads do not pause.'],
['Billing, invoices & receipts','Billing shows each charge, the billing threshold and transaction IDs, and lets you download invoices and receipts. Charges happen when you reach a threshold or on the billing date.','Download monthly receipts for your accountant, including VAT lines.'],
['Account quality & policy appeals','Account Quality lists rejected ads, restrictions and policy issues. If you disagree you can request a review and Meta re-checks the ad or account and may restore it.','Fix the real violation first, then appeal with a short, calm explanation.'],
['Brand safety controls','Inventory filters, block lists and placement exclusions control where your ads can appear, keeping them away from content that does not suit your brand.','Add a block list for apps and publishers if you use Audience Network.']],
tt:[
['Campaign objectives','You pick the goal: Reach, Traffic, Video views, Community interaction, App promotion, Lead generation, Website conversions or Product sales. TikTok then optimizes delivery toward people likely to take that action.','Choose the lowest-funnel objective you have enough data to support.'],
['Campaign budget optimization','You set one campaign budget and TikTok shifts spend between ad groups toward the best performers automatically.','Use it once you have several ad groups with a shared goal.'],
['Smart+ campaigns','Smart+ automates targeting, creative combinations and budget. You upload assets and set a goal, and the system tests combinations and scales what works.','Provide 5 or more varied creatives; automation needs variety to learn.'],
['Split test','You duplicate an ad group and change one variable, such as creative, audience or bidding. TikTok divides traffic evenly and reports which version performs better.','Test one variable and wait until each version has enough results.'],
['Demographics & location','You choose age, gender, language and region, down to city level. TikTok shows your ads only to people who match.','Use broad age ranges and let delivery learn who converts.'],
['Interests & behaviors','You target people by content interests and by behaviors such as video interactions and creator follows, based on what they watch and engage with.','Start with 2–3 broad interest groups, not dozens.'],
['Custom audiences','You build audiences from website visitors (Pixel), customer files, app activity or people who engaged with your videos or profile, then retarget or exclude them.','Create a retargeting audience of people who watched 25% or more of your videos.'],
['Lookalike audiences','You pick a source audience and TikTok finds similar users, with narrow, balanced or broad similarity levels.','Use customers, not just viewers, as the source.'],
['Automated / broad targeting','You leave interests off and let TikTok find the audience using creative signals and conversion history.','Often cheaper; test it against interest targeting.'],
['Exclusions','You remove audiences you do not want to reach, such as recent buyers, existing customers or people who already converted.','Exclude purchasers to avoid wasted frequency.'],
['Placements','You choose TikTok only, or let ads also run on partner apps through Pangle, with placement exclusions available in some setups.','Start with TikTok only for cleaner results and a safer brand environment.'],
['Daily or lifetime budget','Daily budgets cap spend per day; lifetime budgets spread a total over your schedule. TikTok applies minimum budget rules per campaign and ad group.','Check the minimum budget for your objective before planning small tests.'],
['Schedule & dayparting','You set start and end dates and, with a lifetime budget, choose the hours of the week ads run so they appear when your buyers are online.','Use dayparting only after you see clear hourly patterns.'],
['Bidding','Common options are Lowest cost, which maximizes results for the budget, and Cost cap, which controls the average cost. Some goals also offer value-based bidding that chases higher order value.','Begin with Lowest cost; add a cost cap once results are stable.'],
['Reach & frequency','A reservation-style buying mode where you set the audience, the reach target and a frequency limit, so people see the ad a predictable number of times.','Good for launches and events that need guaranteed repetition.'],
['Spark Ads','You boost an existing organic post, yours or a creator’s with their authorization code, as an ad. Likes, comments and shares stay on the post and add social proof.','Boost posts that already earned organic engagement; they often beat polished ads.'],
['In-feed ads','These are standard full-screen vertical video ads that appear in the For You feed between organic videos, with a call-to-action button.','Hook in the first 2 seconds and keep videos to 15–30 seconds.'],
['Carousel & collection ads','A carousel shows several images with music. Collection ads pair a video with product cards that open a fast-loading product gallery.','Use collection ads when you sell many products.'],
['Automated creative optimization','You upload several videos, texts and call-to-action options. TikTok combines them into variations and gives more delivery to the best-performing mixes.','Supply genuinely different hooks so variations really differ.'],
['Symphony / AI creative tools','AI tools in TikTok’s creative suite can draft scripts, avatars, voiceovers and video versions from your product details. You review and edit them before running.','Always check claims, prices and brand tone before publishing AI output.'],
['Video editor & Creative Center','A built-in editor makes vertical ads from clips and templates. Creative Center shows top-performing ads, trending hashtags, songs and creators for inspiration.','Study top ads in your industry weekly for hooks and formats.'],
['Instant Page & lead forms','Instant Pages are fast-loading mobile landing pages inside TikTok. Instant Forms collect leads without leaving the app, with details prefilled.','Ask only for the fields you need; shorter forms convert better.'],
['Creator marketplace','A directory where you find creators, see audience data and rates, send briefs and manage collaborations. Approved content can be boosted as Spark Ads.','Choose creators for audience fit, not follower count.'],
['Comment management','You can reply to, hide, pin and filter comments on your ads, and block keywords, to protect your brand tone and answer buying questions in public.','Pin a comment with the price and how to order.'],
['Video shopping ads','Videos are tagged with TikTok Shop products so viewers can tap and buy inside the app. You select the products and the ad leads to a product page.','Show the price and main benefit within the first 5 seconds.'],
['LIVE shopping ads','You promote your livestream so viewers join and buy while the host demonstrates products. Ads can bring new viewers into the stream while it is live.','Schedule LIVE ads for peak evening hours.'],
['Product shopping ads','Ads are built from your product catalog and display product cards automatically in the feed and search, with dynamic images and prices.','Keep catalog prices, stock and photos up to date.'],
['GMV Max','This is an automated TikTok Shop campaign type. You set a budget and a ROAS target and TikTok spreads spend across videos, LIVE and product ads to maximize sales.','Provide strong product videos and enough budget to learn.'],
['Catalog & product feed','You upload products through a feed or TikTok Shop. The catalog powers shopping ads and lists errors you must fix before products can run.','Resolve feed errors first; a rejected item cannot run.'],
['TikTok Pixel & Events API','The Pixel on your website and the server-side Events API report actions such as add to cart and purchase back to TikTok so the system can optimize and attribute results.','Install both for more reliable tracking.'],
['Events Manager & test events','Events Manager lists the events received and their quality. Test Events lets you trigger an action on your site and see whether TikTok receives it correctly.','Test every key event before you spend.'],
['Custom reports & dashboard','You choose dimensions and metrics, filter by campaign, and save or schedule reports. The dashboard gives a quick view of spend, results and trends.','Add columns for cost per result and video view rate.'],
['Automated rules','You create rules that pause ads, change budgets or notify you when a metric crosses a limit, for example cost per result above your target.','Use notifications first, then automate actions.'],
['Attribution settings','These define the click and view windows used to credit conversions to your ads, so reported results match how you judge sales.','Keep the same window when comparing periods.'],
['Brand safety & inventory filter','Inventory filters choose how sensitive the content next to your ads may be, while block lists and category exclusions add more control.','Choose the standard filter for most brands.'],
['Business Center & roles','Business Center manages ad accounts, pixels, catalogs and team members in one place with role-based permissions and partner sharing.','Give agencies access through Business Center, never shared passwords.'],
['Payments & auto top-up','You add funds manually or set auto top-up when the balance drops below a threshold, or use postpay billing where you are eligible.','Keep balance above 2–3 days of spend so ads do not pause.'],
['Ad review & account health','Every ad is reviewed before it runs. Account health lists rejected ads and policy issues, explains what to fix and offers an appeal.','Read the rejection reason; many are small copy or image fixes.'],
['Asset library','A shared library holds your videos, images and audio so you can reuse them across campaigns, with names and tags to find them quickly.','Name assets by concept and date.']],
